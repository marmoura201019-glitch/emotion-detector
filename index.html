<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sad Emotion Detector</title>
<style>
body {
    text-align: center;
    font-family: Arial, sans-serif;
    padding-top: 60px;
    background-color: #f4f4f4;
}
#emotion {
    margin-top: 30px;
    font-size: 28px;
    font-weight: bold;
}
#advice {
    margin-top: 20px;
    font-size: 18px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    color: darkblue;
}
button {
    margin-top: 25px;
    padding: 12px 24px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>Sad Emotion Detector</h1>

<div id="emotion"></div>
<div id="advice"></div>

<button id="startBtn">Start Listening</button>
<br>
<button id="resetBtn">Reset</button>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

<script>

const URL = "https://teachablemachine.withgoogle.com/models/RRSNH3AgE/";
let recognizer;
let listening = false;

async function loadModel() {
    const checkpointURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    recognizer = speechCommands.create(
        "BROWSER_FFT",
        undefined,
        checkpointURL,
        metadataURL
    );

    await recognizer.ensureModelLoaded();
}

async function startListening() {

    if (listening || !recognizer) return;

    listening = true;
    document.getElementById("emotion").innerText = "Listening...";
    document.getElementById("advice").innerText = "";

    const labels = recognizer.wordLabels();

    recognizer.listen(result => {

        const scores = result.scores;
        const highestScore = Math.max(...scores);
        const highestIndex = scores.indexOf(highestScore);
        const detectedEmotion = labels[highestIndex].toLowerCase();

        // ONLY detect SAD
        if (detectedEmotion === "sad" && highestScore > 0.85) {

            recognizer.stopListening();
            listening = false;

            document.getElementById("emotion").innerText =
                "Detected Emotion: Sad";

            document.getElementById("advice").innerText =
                "Sadness detected. It’s okay to feel this way. Take a moment for yourself, breathe slowly, and consider talking to someone you trust.";
        }

    }, {
        probabilityThreshold: 0.85,
        overlapFactor: 0.5
    });
}

function resetApp() {
    document.getElementById("emotion").innerText = "";
    document.getElementById("advice").innerText = "";
}

document.getElementById("startBtn").addEventListener("click", startListening);
document.getElementById("resetBtn").addEventListener("click", resetApp);

window.onload = loadModel;

</script>

</body>
</html>

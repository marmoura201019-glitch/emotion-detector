<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Emotion Detector</title>

<style>
body {
    text-align: center;
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    padding-top: 60px;
}

h1 {
    font-size: 32px;
}

button {
    margin: 10px;
    padding: 12px 25px;
    font-size: 16px;
    cursor: pointer;
}

#emotion {
    margin-top: 30px;
    font-size: 26px;
    font-weight: bold;
}

#advice {
    margin-top: 15px;
    font-size: 18px;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
}
</style>
</head>

<body>

<h1>Emotion Detector</h1>

<button onclick="showEmotion('happy')">Happy</button>
<button onclick="showEmotion('sad')">Sad</button>
<button onclick="showEmotion('angry')">Angry</button>
<button onclick="showEmotion('neutral')">Neutral</button>

<div id="emotion"></div>
<div id="advice"></div>

<script>
function showEmotion(emotion) {

    let adviceText = "";

    if (emotion === "happy") {
        adviceText = "You seem happy! That’s a powerful and positive emotion to experience. Happiness can improve your focus, boost your confidence, and strengthen your relationships with others. Try to hold onto this positive energy and use it to accomplish something meaningful today. Whether it’s helping someone, working on a goal, or simply enjoying the moment, happiness can fuel productivity and creativity. Sharing your joy with others can also brighten their day and create a positive environment around you.";
    } 
    else if (emotion === "sad") {
        adviceText = "You seem sad. It’s completely normal to feel this way sometimes, and it’s important to allow yourself to experience emotions instead of pushing them away. Try to reflect on what might be causing this feeling and give yourself space to process it. Talking to someone you trust, listening to calming music, going for a short walk, or writing your thoughts down can help you feel better. Remember, emotions are temporary, and difficult moments often pass with time and support.";
    } 
    else if (emotion === "angry") {
        adviceText = "You seem angry. Anger is a strong emotion that can sometimes take control if we react too quickly. Instead of responding immediately, pause and take a few deep breaths. Giving yourself a short break can help you think clearly and avoid saying or doing something you might regret. Try to identify what triggered your anger and consider a calm way to address it. Managing anger effectively shows maturity and emotional intelligence.";
    } 
    else {
        adviceText = "You seem neutral. This balanced emotional state can help you think clearly and make rational decisions. Being neutral doesn’t mean you feel nothing—it often means you are calm and steady. Use this state to focus on tasks, plan ahead, or reflect on your goals. Staying emotionally balanced can help you handle challenges more effectively and maintain control in different situations.";
    }

    document.getElementById("emotion").innerText =
        "Detected Emotion: " + emotion.charAt(0).toUpperCase() + emotion.slice(1);

    document.getElementById("advice").innerText = adviceText;
}
</script>

</body>
</html>

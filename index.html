<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
</head>
<body style="text-align:center; font-family:Arial; padding-top:40px;">

    <div style="font-size:28px; font-weight:bold;">Emotion Detector</div>

    <div id="emotion" style="margin-top:30px; font-size:24px; font-weight:bold;"></div>
    <div id="advice" style="margin-top:15px; font-size:18px; color:darkgreen; max-width:600px; margin-left:auto; margin-right:auto;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/RRSNH3AgE/";
        let lastDetected = "";
        let adviceTimeout = null;

        async function createModel() {
            const checkpointURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";
            const recognizer = speechCommands.create("BROWSER_FFT", undefined, checkpointURL, metadataURL);
            await recognizer.ensureModelLoaded();
            return recognizer;
        }

        async function init() {
    const recognizer = await createModel();
    const classLabels = recognizer.wordLabels();

    function startListening() {
        recognizer.listen(result => {
            const scores = result.scores;
            let maxScore = 0;
            let detected = "";

            for (let i = 0; i < classLabels.length; i++) {
                if (scores[i] > maxScore) {
                    maxScore = scores[i];
                    detected = classLabels[i];
                }
            }

            detected = detected.toLowerCase();

            if (detected !== lastDetected) {
                lastDetected = detected;

                recognizer.stopListening(); // ⛔ STOP listening
                showAdvice(detected);

                // ⏳ Wait 20 seconds before listening again
                setTimeout(() => {
                    lastDetected = "";
                    document.getElementById("emotion").innerText = "";
                    startListening(); // ▶ Start again
                }, 20000);
            }
        }, {
            includeSpectrogram: true,
            probabilityThreshold: 0.8,
            overlapFactor: 0.5
        });
    }

    startListening();
}
                    }
                }

                detected = detected.toLowerCase();

                if (detected !== lastDetected) {
                    lastDetected = detected;
                    showAdvice(detected);
                }

            }, {
                includeSpectrogram: true,
                probabilityThreshold: 0.9,
                invokeCallbackOnNoiseAndUnknown: true,
                overlapFactor: 0.5
            });
        }

        window.onload = init;

        function showAdvice(detected) {
            let adviceOptions = [];

            if (detected === "happy") {
                adviceOptions = [
                    "I hear happiness in your voice! Enjoy this feeling and share it with someone around you.",
                    "Your positive energy is contagious! Celebrate small wins and spread your joy."
                ];
            } else if (detected === "angry") {
                adviceOptions = [
                    "I sense frustration. Take a deep breath, step back, and respond calmly.",
                    "Anger is natural. Pause, release tension safely, and think before you act."
                ];
            } else if (detected === "sad") {
                adviceOptions = [
                    "I sense sadness. Take a moment to care for yourself, maybe do something comforting.",
                    "Feeling down is normal. A short walk, journaling, or talking to someone can help."
                ];
            } else {
                adviceOptions = ["Neutral tone detected. Take a moment to check in with yourself."];
            }

            const advice = adviceOptions[Math.floor(Math.random() * adviceOptions.length)];

            document.getElementById("emotion").innerText =
                "Detected Emotion: " + detected.charAt(0).toUpperCase() + detected.slice(1);

            const box = document.getElementById("advice");
            box.innerHTML = "";
            let i = 0;

            if (adviceTimeout) clearTimeout(adviceTimeout);

            let typing = setInterval(function() {
                if (i < advice.length) {
                    box.innerHTML += advice.charAt(i);
                    i++;
                } else {
                    clearInterval(typing);
                    adviceTimeout = setTimeout(() => { box.innerHTML = ""; }, 10000);
                }
            }, 35);
        }
    </script>

</body>
</html>

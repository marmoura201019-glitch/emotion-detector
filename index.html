<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Emotion Detector</title>
<style>
body {
    text-align: center;
    font-family: Arial, sans-serif;
    padding-top: 50px;
    background-color: #f4f4f4;
}
#emotion {
    margin-top: 30px;
    font-size: 26px;
    font-weight: bold;
}
#advice {
    margin-top: 20px;
    font-size: 18px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    color: darkgreen;
}
button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>AI Emotion Detector</h1>

<div id="emotion"></div>
<div id="advice"></div>

<button id="startBtn">Start Listening</button>
<br>
<button id="resetBtn">Reset</button>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/RRSNH3AgE/";

let recognizer;
let isListening = false;
let audioContext;
let analyser;
let microphone;
let dataArray;

async function loadModel() {
    const checkpointURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    recognizer = speechCommands.create(
        "BROWSER_FFT",
        undefined,
        checkpointURL,
        metadataURL
    );

    await recognizer.ensureModelLoaded();
}

// 🎤 Setup microphone volume detection
async function setupMic() {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    microphone = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    microphone.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
}

function getVolumeLevel() {
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
    }
    return sum / dataArray.length;
}

async function startListening() {

    if (isListening) return;
    if (!recognizer) return;

    isListening = true;

    document.getElementById("emotion").innerText = "Listening...";
    document.getElementById("advice").innerText = "";

    const labels = recognizer.wordLabels();

    recognizer.listen(result => {

        const volume = getVolumeLevel();

        // 🔵 If voice is VERY LOW → force SAD
        if (volume < 10) {
            recognizer.stopListening();
            isListening = false;
            showAdvice("sad");
            return;
        }

        const scores = result.scores;
        let highestScore = 0;
        let highestIndex = 0;

        for (let i = 0; i < scores.length; i++) {
            if (scores[i] > highestScore) {
                highestScore = scores[i];
                highestIndex = i;
            }
        }

        if (highestScore > 0.85) {
            recognizer.stopListening();
            isListening = false;

            const emotion = labels[highestIndex].toLowerCase();
            showAdvice(emotion);
        }

    }, {
        probabilityThreshold: 0.85,
        overlapFactor: 0.5
    });
}

function showAdvice(emotion) {

    let adviceText = "";

    if (emotion === "happy") {
        adviceText = "You sound happy. Keep embracing your positive energy and share it with others.";
    } 
    else if (emotion === "angry") {
        adviceText = "Anger detected. Take a deep breath and respond calmly.";
    } 
    else if (emotion === "sad") {
        adviceText = "Low tone detected. You may be feeling sad. Take care of yourself and talk to someone you trust.";
    } 
    else {
        adviceText = "Neutral tone detected. Take a moment to reflect.";
    }

    document.getElementById("emotion").innerText =
        "Detected Emotion: " + emotion.charAt(0).toUpperCase() + emotion.slice(1);

    document.getElementById("advice").innerText = adviceText;
}

function resetApp() {
    document.getElementById("emotion").innerText = "";
    document.getElementById("advice").innerText = "";
}

document.getElementById("startBtn").addEventListener("click", async () => {
    await setupMic();
    startListening();
});

document.getElementById("resetBtn").addEventListener("click", resetApp);

window.onload = loadModel;

</script>

</body>
</html>

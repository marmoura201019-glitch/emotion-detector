<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
</head>

<body style="text-align:center; font-family:Arial; padding-top:40px; direction:ltr;">

<h2>Emotion Detector</h2>

<div id="emotion" style="margin-top:30px; font-size:24px; font-weight:bold;"></div>
<div id="advice" style="margin-top:15px; font-size:18px; color:darkgreen; max-width:600px; margin:auto;"></div>

<button id="startBtn" style="margin-top:25px; padding:10px 20px; font-size:16px;">
Start Listening
</button>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

<script>

const URL = "https://teachablemachine.withgoogle.com/models/RRSNH3AgE/";
let recognizer = null;
let listening = false;

async function loadModel() {
    const checkpointURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    recognizer = speechCommands.create(
        "BROWSER_FFT",
        undefined,
        checkpointURL,
        metadataURL
    );

    await recognizer.ensureModelLoaded();
    console.log("Model Loaded");
}

async function startListening() {

    if (!recognizer) {
        alert("Model not loaded yet. Wait 2 seconds and try again.");
        return;
    }

    if (listening) return;

    listening = true;
    document.getElementById("emotion").innerText = "Listening...";
    document.getElementById("advice").innerText = "";

    const labels = recognizer.wordLabels();

    recognizer.listen(result => {

        const scores = result.scores;
        let highest = 0;
        let index = 0;

        for (let i = 0; i < scores.length; i++) {
            if (scores[i] > highest) {
                highest = scores[i];
                index = i;
            }
        }

        if (highest > 0.85) {

            recognizer.stopListening(); // STOP
            listening = false;

            const emotion = labels[index].toLowerCase();
            showResult(emotion);
        }

    }, {
        probabilityThreshold: 0.85,
        overlapFactor: 0.5
    });
}

function showResult(emotion) {

    let advice = "";

    if (emotion === "happy") {
        advice = "You sound happy. Keep enjoying this positive energy and use it to do something meaningful.";
    } 
    else if (emotion === "angry") {
        advice = "Anger detected. Take a breath, pause, and respond calmly.";
    } 
    else if (emotion === "sad") {
        advice = "Sadness detected. Be kind to yourself and talk to someone you trust.";
    } 
    else {
        advice = "Neutral tone detected. Take a moment to reset and refocus.";
    }

    document.getElementById("emotion").innerText =
        "Detected Emotion: " + emotion;

    document.getElementById("advice").innerText = advice;
}

document.getElementById("startBtn").addEventListener("click", startListening);

window.onload = loadModel;

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Emotion Detector</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 50px;
        background-color: #f9f9f9;
        color: #333;
    }

    h1 {
        font-size: 36px;
        color: #007BFF;
        margin-bottom: 30px;
    }

    #emotion {
        font-size: 28px;
        font-weight: bold;
        padding: 20px;
        margin-top: 20px;
        background-color: #e0f7fa;
        border-radius: 10px;
        display: inline-block;
        min-width: 250px;
    }

    #advice {
        font-size: 18px;
        max-width: 600px;
        margin: 20px auto 0 auto;
        padding: 15px;
        line-height: 1.5;
        border-left: 5px solid #007BFF;
        background-color: #ffffff;
        border-radius: 5px;
        color: #333;
    }

    button {
        font-size: 16px;
        padding: 12px 25px;
        margin-top: 25px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background-color: #007BFF;
        color: white;
        transition: 0.3s;
    }

    button:hover {
        background-color: #0056b3;
    }
</style>
</head>

<body>

<h1>Emotion Detector</h1>

<div id="emotion">Click Start to detect your emotion</div>
<div id="advice">Advice will appear here.</div>

<button onclick="startListening()">Start Listening</button>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/RRSNH3AgE/";
let recognizer = null;
let listening = false;

// Load the model
async function loadModel() {
    recognizer = speechCommands.create(
        "BROWSER_FFT",
        undefined,
        URL + "model.json",
        URL + "metadata.json"
    );
    await recognizer.ensureModelLoaded();
    console.log("Model loaded");
}
loadModel();

// Start listening function
async function startListening() {
    if (!recognizer) {
        alert("Model not loaded yet. Wait a few seconds and try again.");
        return;
    }
    if (listening) return;

    listening = true;
    document.getElementById("emotion").innerText = "Listening...";
    document.getElementById("advice").innerText = "";

    const labels = recognizer.wordLabels();

    recognizer.listen(result => {
        const scores = result.scores;
        let maxScore = 0;
        let maxIndex = 0;

        for (let i = 0; i < scores.length; i++) {
            if (scores[i] > maxScore) {
                maxScore = scores[i];
                maxIndex = i;
            }
        }

        if (maxScore > 0.85) { // confident detection
            recognizer.stopListening(); // stop immediately
            listening = false;

            const emotion = labels[maxIndex].toLowerCase();
            showEmotion(emotion);
        }

    }, {
        includeSpectrogram: true,
        probabilityThreshold: 0.85,
        overlapFactor: 0.5
    });
}

// Show emotion and advice
function showEmotion(emotion) {
    let advice = "";

    if (emotion === "happy") {
        advice = "You sound happy! Embrace this positive energy and share it with others. Small moments of joy can brighten your whole day and inspire those around you.";
    } 
    else if (emotion === "angry") {
        advice = "I detect anger. Take a deep breath and pause for a moment. Respond calmly, and try to channel your energy into something productive.";
    } 
    else if (emotion === "sad") {
        advice = "You seem sad. It's okay to feel this way. Take care of yourself, talk to someone you trust, or do something comforting. Emotions pass with time.";
    } 
    else {
        advice = "Neutral tone detected. Take a moment to reflect, reset, and focus on the next task or moment.";
    }

    document.getElementById("emotion").innerText = "Detected Emotion: " + emotion.charAt(0).toUpperCase() + emotion.slice(1);
    document.getElementById("advice").innerText = advice;
}
</script>

</body>
</html>

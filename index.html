<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
</head>

<body style="text-align:center; font-family:Arial; padding-top:40px; direction:ltr;">

    <div style="font-size:28px; font-weight:bold;">
        Emotion Detector
    </div>

    <div id="emotion" style="margin-top:30px; font-size:24px; font-weight:bold;"></div>

    <div id="advice" style="margin-top:15px; font-size:18px; color:darkgreen; max-width:600px; margin-left:auto; margin-right:auto;"></div>

    <button onclick="startListening()" 
        style="margin-top:25px; padding:10px 20px; font-size:16px;">
        Start Listening
    </button>

    <button onclick="resetDetector()" 
        style="margin-top:10px; padding:8px 18px; font-size:14px;">
        Reset
    </button>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/RRSNH3AgE/";

let recognizer;
let isListening = false;

async function createModel() {
    const checkpointURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    recognizer = speechCommands.create(
        "BROWSER_FFT",
        undefined,
        checkpointURL,
        metadataURL
    );

    await recognizer.ensureModelLoaded();
}

async function startListening() {
    if (isListening) return;

    isListening = true;
    document.getElementById("emotion").innerText = "Listening...";
    document.getElementById("advice").innerText = "";

    const classLabels = recognizer.wordLabels();

    recognizer.listen(result => {
        const scores = result.scores;

        let maxScore = 0;
        let detected = "";

        for (let i = 0; i < classLabels.length; i++) {
            if (scores[i] > maxScore) {
                maxScore = scores[i];
                detected = classLabels[i];
            }
        }

        if (maxScore > 0.8) {
            recognizer.stopListening();   // STOP completely
            isListening = false;

            detected = detected.toLowerCase();
            showAdvice(detected);
        }

    }, {
        includeSpectrogram: true,
        probabilityThreshold: 0.8,
        overlapFactor: 0.5
    });
}

function showAdvice(detected) {

    let advice = "";

    if (detected === "happy") {
        advice = "You sound happy! Keep embracing this positivity and share it with others around you. Moments like this help build confidence and motivation.";
    }
    else if (detected === "angry") {
        advice = "I sense anger. Take a deep breath, pause for a moment, and respond calmly. Managing emotions wisely makes you stronger.";
    }
    else if (detected === "sad") {
        advice = "You seem sad. Give yourself time, talk to someone you trust, and do something small that comforts you. Feelings always pass.";
    }
    else {
        advice = "Neutral tone detected. Take a moment to reflect and check in with yourself before moving forward.";
    }

    document.getElementById("emotion").innerText =
        "Detected Emotion: " +
        detected.charAt(0).toUpperCase() + detected.slice(1);

    document.getElementById("advice").innerText = advice;
}

function resetDetector() {
    document.getElementById("emotion").innerText = "";
    document.getElementById("advice").innerText = "";
}

window.onload = async () => {
    await createModel();
};
</script>

</body>
</html>
